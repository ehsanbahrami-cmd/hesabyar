name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          SET=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$SET" ]; then
            ZIP=$(find . -name "*.zip" | head -1)
            echo "Zip: $ZIP"
            mkdir -p /tmp/proj
            unzip -q -o "$ZIP" -d /tmp/proj
            SET=$(find /tmp/proj -name settings.gradle.kts | head -1)
          fi
          DIR=$(dirname "$SET")
          echo "Project dir: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: HesabYar-apk
          path: out/*.apk
